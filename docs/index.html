<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文化資產知識庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; height: 100vh; display: flex; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f0f2f5; overflow: hidden; }
  #sidebar { flex: 0 0 25%; min-width: 300px; max-width: 420px; display: flex; flex-direction: column; background: #fff; box-shadow: 2px 0 8px rgba(0,0,0,.12); z-index: 10; }
  #query-container { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #e3e6ea; }
  #query-input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
  #query-button { padding: 8px 14px; font-size: 16px; color: #fff; background: #4caf50; border: 0; border-radius: 4px; cursor: pointer; }
  #query-button:hover { background: #45a049; }
  #query-button:disabled { background: #9ccc9f; cursor: wait; }
  #results-container { flex: 1; overflow-y: auto; padding: 12px; }
  #results-content { white-space: pre-wrap; line-height: 1.6; margin-top: 6px; }
  #hint { color: #888; font-size: 12px; line-height: 1.6; }
  #brand { padding: 14px 12px 0; font: 600 22px "Noto Serif TC", serif; color: #2f3a4a; }
  #brand small { display: block; margin-top: 2px; font: 400 12px "Noto Sans TC", sans-serif; color: #888; }
  .cite { display: inline-block; min-width: 16px; padding: 0 4px; margin: 0 1px; font-size: 12px; line-height: 16px; text-align: center; color: #fff; background: #2b7ce9; border-radius: 8px; cursor: pointer; vertical-align: super; }
  .cite:hover { background: #1a5fc0; }
  #trust { margin-top: 12px; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #35603a; background: #eef7ee; border-radius: 6px; }
  #trust.warn { color: #7a5a00; background: #fff6dc; }
  #trust ol { margin: 6px 0 0; padding-left: 20px; } #trust li { cursor: pointer; } #trust li:hover { text-decoration: underline; }
  .conflict { margin: 10px 0; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #7a5a00; background: #fff6dc; border-radius: 6px; }
  .src { margin: 8px 0; padding: 8px 10px; font-size: 12px; line-height: 1.6; background: #f6f7f9; border-radius: 6px; }
  .src q { display: block; margin-top: 4px; color: #444; quotes: none; }
  .tag { display: inline-block; margin-right: 4px; padding: 0 6px; font-size: 12px; color: #35603a; background: #dff0e0; border-radius: 8px; }
  #answer { white-space: pre-wrap; line-height: 1.7; font-size: 16px; }
  #entities h4, #detail h4 { margin: 16px 0 6px; font-size: 12px; color: #888; font-weight: normal; }
  .chip { display: inline-block; margin: 0 6px 6px 0; padding: 3px 9px; font-size: 12px; background: #eef2f7; border-radius: 12px; cursor: pointer; }
  .chip::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); }
  .chip:hover { background: #dde6f1; }
  #detail h3 { margin: 8px 0 4px; font-size: 22px; }
  #back { color: #2b7ce9; cursor: pointer; font-size: 12px; }
  #legend label { cursor: pointer; user-select: none; margin-right: 6px; }
  #legend label.off { opacity: .4; }
  pre { white-space: pre-wrap; font-size: 12px; color: #444; background: #f6f6f6; padding: 8px; border-radius: 4px; }
  #graph { position: relative; flex: 1; min-width: 0; }
  #mynetwork { width: 100%; height: 100%; }
  #legend { position: absolute; left: 12px; bottom: 12px; z-index: 5; font-size: 12px; background: rgba(255,255,255,.9); padding: 8px 10px; border-radius: 6px; }
  #legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 8px; vertical-align: middle; }
  #tools { position: absolute; top: 12px; right: 12px; z-index: 5; display: flex; gap: 6px; }
  #tools select, #tools button { padding: 6px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
  #tools button:hover { background: #eef2f7; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #3498db; }
</style>
</head>
<body>
<aside id="sidebar">
  <div id="brand">文化資產知識庫<small>答案皆來自已校對、可公開的知識圖譜，並附出處</small></div>
  <div id="query-container">
    <input id="query-input" placeholder="問知識圖譜一個問題，例如：靈應宮的屋頂歷來怎麼修？" autofocus>
    <button id="query-button">Search</button>
  </div>
  <div id="results-container">
    <div id="hint">輸入問題後，答案會顯示在這裡，相關實體可點擊查看；右側圖譜中無關節點會變灰。也可直接點圖上的節點。</div>
    <div id="answer" hidden></div>
    <div id="trust" hidden></div>
    <div id="entities" hidden></div>
    <div id="detail" hidden></div>
  </div>
</aside>
<main id="graph">
  <div id="loading">Loading graph...</div>
  <div id="mynetwork"></div>
  <div id="tools">
  <select id="layout" title="佈局">
    <option value="fa2">ForceAtlas2（力導向）</option><option value="circular">環形</option>
    <option value="cluster">依類別分群</option><option value="noverlap">防重疊（Noverlap）</option><option value="random">隨機</option>
  </select>
  <select id="focus-mode" title="聚焦排法">
    <option value="concentric">聚焦：同心圓</option><option value="force">聚焦：力導向</option>
    <option value="columns">聚焦：依類別分欄</option><option value="timeline">聚焦：時間軸</option>
  </select>
  <button id="restore" title="還原到搜尋前的佈局並取消變灰">還原佈局</button>
  </div>
  <div id="legend"></div>
</main>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script>
const COLORS = { 個案: '#F6C85F', 修繕事件: '#5CC8B0', 匠師: '#6C8EF5', 構件: '#B58CE0', 年代: '#E8B466', 文件: '#9AA5B1', 單位: '#F28B82' };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let nodes, edges, G = {}, active = null, queryActive = null, only = new Set(), hasAnswer = false;

// 套用目前狀態：有查詢時，無關節點與邊變灰；類別被關掉的節點隱藏
function paint() {
  nodes.update(nodes.get().map(n => {
    const dim = active && !active.has(n.id), hit = active && active.has(n.id);
    return { id: n.id, hidden: only.size > 0 && !only.has(n.kind), size: n.kind === '個案' ? 22 : 16, borderWidth: hit ? 4 : 2,
      color: dim ? { background: '#E3E6EA', border: '#CDD2D8' } : { background: COLORS[n.kind], border: hit ? '#FFC300' : '#2B7CE9' },
      font: { size: 14, color: dim ? '#B5BBC2' : '#333' } };
  }));
  edges.update(edges.get().map(e => ({ id: e.id, color: { color: active && !(active.has(e.from) && active.has(e.to)) ? '#E3E6EA' : '#848484', highlight: '#FFC300' } })));
}

// 佈局：fa2 交給 vis 物理引擎，其餘直接算座標後關掉物理
function setLayout(name) {
  net.setOptions({ physics: { enabled: name === 'fa2' } });
  if (name === 'fa2') return net.stabilize(250);
  const ids = nodes.getIds(), R = 60 * Math.sqrt(ids.length), P = {};
  const kinds = Object.keys(COLORS), byKind = k => ids.filter(i => G[i].kind === k);
  if (name === 'circular') [...ids].sort((a, b) => kinds.indexOf(G[a].kind) - kinds.indexOf(G[b].kind))
    .forEach((id, i) => P[id] = [R * Math.cos(2 * Math.PI * i / ids.length), R * Math.sin(2 * Math.PI * i / ids.length)]);
  if (name === 'random') ids.forEach(id => P[id] = [(Math.random() - .5) * 2 * R, (Math.random() - .5) * 2 * R]);
  if (name === 'cluster') kinds.forEach((k, ki) => { const m = byKind(k), a = 2 * Math.PI * ki / kinds.length, cx = R * Math.cos(a), cy = R * Math.sin(a);
    m.forEach((id, i) => P[id] = m.length === 1 ? [cx, cy] : [cx + 25 * Math.sqrt(m.length) * Math.cos(2 * Math.PI * i / m.length), cy + 25 * Math.sqrt(m.length) * Math.sin(2 * Math.PI * i / m.length)]); });
  if (name === 'noverlap') { // 從目前位置出發，把太近的節點推開
    const cur = net.getPositions(); ids.forEach(id => P[id] = [cur[id].x, cur[id].y]);
    for (let it = 0; it < 200; it++) for (const a of ids) for (const b of ids) if (a < b) {
      const dx = P[b][0] - P[a][0], dy = P[b][1] - P[a][1], d = Math.hypot(dx, dy) || .01, min = 90;
      if (d < min) { const f = (min - d) / 2 / d; P[a][0] -= dx * f; P[a][1] -= dy * f; P[b][0] += dx * f; P[b][1] += dy * f; } } }
  ids.forEach(id => net.moveNode(id, P[id][0], P[id][1]));
  net.fit({ animation: true });
}
// 聚焦：命中／選取的節點依「聚焦排法」重排，其餘節點往外推開，補間動畫後鏡頭拉近
let anim = 0, home = null, focusMode = 'concentric';
const KIND_ORDER = Object.keys(COLORS);

const arrangers = { // 各回傳 { id: [x, y] }，座標以 (cx, cy) 為中心
  concentric(ids, es, center, cx, cy) { // 以中心節點為圓心、依連線距離排同心圓
    const nb = id => es.flatMap(e => e.from === id ? [e.to] : e.to === id ? [e.from] : []);
    const depth = { [center]: 0 };
    for (let q = [center]; q.length;) { const f = q.shift(); nb(f).forEach(n => depth[n] === undefined && (depth[n] = depth[f] + 1, q.push(n))); }
    const maxD = Math.max(...Object.values(depth)) + 1, rings = {}, T = { [center]: [cx, cy] };
    ids.forEach(i => (rings[depth[i] ?? maxD] ||= []).push(i));
    for (const [d, m] of Object.entries(rings)) if (+d > 0) {
      const r = Math.max(150 * d, m.length * 85 / (2 * Math.PI));
      m.forEach((id, k) => T[id] = [cx + r * Math.cos(2 * Math.PI * k / m.length + +d), cy + r * Math.sin(2 * Math.PI * k / m.length + +d)]);
    }
    return T;
  },
  force(ids, es, center, cx, cy) { // 從同心圓出發，只對命中子圖跑 Fruchterman-Reingold，看出自然群聚
    const T = arrangers.concentric(ids, es, center, cx, cy), P = Object.fromEntries(ids.map(i => [i, [...T[i]]]));
    for (let it = 0; it < 250; it++) {
      const D = Object.fromEntries(ids.map(i => [i, [0, 0]]));
      for (const a of ids) for (const b of ids) if (a < b) {
        const dx = P[a][0] - P[b][0], dy = P[a][1] - P[b][1], d = Math.hypot(dx, dy) || .1, f = 14000 / (d * d);
        D[a][0] += dx / d * f; D[a][1] += dy / d * f; D[b][0] -= dx / d * f; D[b][1] -= dy / d * f; }
      for (const e of es) { const dx = P[e.to][0] - P[e.from][0], dy = P[e.to][1] - P[e.from][1], d = Math.hypot(dx, dy) || .1, f = (d - 130) * .05;
        D[e.from][0] += dx / d * f; D[e.from][1] += dy / d * f; D[e.to][0] -= dx / d * f; D[e.to][1] -= dy / d * f; }
      for (const i of ids) { P[i][0] += Math.max(-20, Math.min(20, D[i][0] - (P[i][0] - cx) * .01)); P[i][1] += Math.max(-20, Math.min(20, D[i][1] - (P[i][1] - cy) * .01)); }
    }
    return P;
  },
  columns(ids, es, center, cx, cy) { // 依類別分欄：個案 | 事件 | 匠師 ...，欄內依名稱排序
    const ks = KIND_ORDER.filter(k => ids.some(i => G[i].kind === k)), T = {};
    ks.forEach((k, ki) => { const m = ids.filter(i => G[i].kind === k).sort((a, b) => G[a].label.localeCompare(G[b].label, 'zh-Hant', { numeric: true }));
      m.forEach((id, i) => T[id] = [cx + (ki - (ks.length - 1) / 2) * 240, cy + (i - (m.length - 1) / 2) * 62]); });
    return T;
  },
  timeline(ids, es, center, cx, cy) { // 時間軸：事件依年代由左到右，其他實體靠到相關事件下方（各類別一列）
    const evs = ids.filter(i => G[i].year), ys = evs.map(i => G[i].year[0]);
    if (!evs.length) return arrangers.columns(ids, es, center, cx, cy);
    const lo = Math.min(...ys), span = Math.max(Math.max(...ys) - lo, 1), W = Math.max(evs.length * 140, 800), T = {}, rows = {};
    const xOf = id => G[id].year ? cx - W / 2 + (G[id].year[0] - lo) / span * W
      : (xs => xs.length ? xs.reduce((a, b) => a + b) / xs.length : cx)(es.flatMap(e => e.from === id ? [e.to] : e.to === id ? [e.from] : []).filter(n => G[n].year).map(xOf));
    ids.forEach(i => (rows[G[i].kind] ||= []).push([i, xOf(i)]));
    const ks = KIND_ORDER.filter(k => rows[k]);
    ks.forEach((k, ri) => { let last = -Infinity; rows[k].sort((a, b) => a[1] - b[1]).forEach(([id, x]) => { x = Math.max(x, last + 140); last = x; T[id] = [x, cy + (ri - (ks.length - 1) / 2) * 110]; }); });
    const mid = Object.values(T).reduce((a, p) => a + p[0], 0) / ids.length; ids.forEach(i => T[i][0] += cx - mid);
    return T;
  }
};

function tween(T, done) { // 補間動畫：所有節點從目前位置移到 T
  const cur = net.getPositions(), token = ++anim, t0 = performance.now();
  const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900;
  net.setOptions({ physics: { enabled: false } });
  const step = now => {
    if (token !== anim) return;
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < .5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
    for (const id in T) net.moveNode(id, cur[id].x + (T[id][0] - cur[id].x) * e, cur[id].y + (T[id][1] - cur[id].y) * e);
    k < 1 ? requestAnimationFrame(step) : done && done();
  };
  requestAnimationFrame(step);
}

function focusLayout(ids, center) {
  const act = new Set(ids), cur = net.getPositions();
  home ||= Object.fromEntries(Object.entries(cur).map(([id, p]) => [id, [p.x, p.y]])); // 第一次聚焦前先記住佈局，供「還原」用
  const es = edges.get().filter(e => act.has(e.from) && act.has(e.to));
  const deg = id => es.filter(e => e.from === id || e.to === id).length;
  center = center || [...act].sort((a, b) => deg(b) - deg(a))[0];
  const cx = ids.reduce((a, i) => a + cur[i].x, 0) / ids.length, cy = ids.reduce((a, i) => a + cur[i].y, 0) / ids.length;
  const T = arrangers[focusMode](ids, es, center, cx, cy);
  const outer = Math.max(...ids.map(i => Math.hypot(T[i][0] - cx, T[i][1] - cy)));
  for (const id of nodes.getIds()) if (!act.has(id)) { // 無關節點沿原方向被推到外圍
    const dx = cur[id].x - cx, dy = cur[id].y - cy, d = Math.hypot(dx, dy) || 1, to = outer + 260 + d * .4;
    T[id] = [cx + dx / d * to, cy + dy / d * to];
  }
  tween(T, () => net.fit({ nodes: ids, animation: { duration: 700, easingFunction: 'easeInOutQuad' } }));
}

function restoreLayout() { // 還原到第一次聚焦前的佈局，並取消變灰
  active = queryActive = null; paint();
  if (home) { const h = home; home = null; tween(h, () => net.fit({ animation: { duration: 700, easingFunction: 'easeInOutQuad' } })); }
  if (!$('detail').hidden) show(hasAnswer ? 'answer' : 'home');
}
$('restore').onclick = restoreLayout;

$('focus-mode').onchange = e => { focusMode = e.target.value; if (active) focusLayout([...active]); };
$('layout').onchange = e => { anim++; home = null; setLayout(e.target.value); };

const chip = id => `<span class="chip" data-id="${id}" style="--c:${COLORS[G[id].kind]}">${esc(G[id].label)}</span>`;
const group = ids => Object.keys(COLORS).map(k => [k, ids.filter(i => G[i].kind === k)]).filter(([, v]) => v.length)
  .map(([k, v]) => `<h4>${k}（${v.length}）</h4>${v.map(chip).join('')}`).join('');

function show(view) { // 'home' | 'answer' | 'detail'
  $('hint').hidden = view !== 'home' || hasAnswer;
  $('answer').hidden = $('entities').hidden = view === 'detail' || !hasAnswer;
  if (view === 'detail') $('trust').hidden = true; else if ($('trust').innerHTML) $('trust').hidden = !hasAnswer;
  $('detail').hidden = view !== 'detail';
}

const statusTag = s => `<span class="tag">${esc(s.status)}</span><span class="tag">${esc(s.method)}${s.confidence ? ' · 信心 ' + s.confidence : ''}</span>`;
const srcCard = s => `<div class="src">《${esc(s.doc)}》第 ${s.page} 頁${s.claim ? `，記載為 ${esc(s.claim)} 年` : ''}<br>${statusTag(s)}<q>${esc(s.quote)}</q></div>`;
function eventTrust(n) { // 事件資訊：描述、記載衝突提示、每筆出處的校對狀態與原文
  const claims = [...new Set(n.sources.map(s => s.claim).filter(Boolean))];
  return `<pre>${esc(n.detail.split('\n    出處')[0])}</pre>
    ${claims.length > 1 ? `<div class="conflict">⚠ 不同出處對年代有 ${claims.length} 種記載：${esc(claims.join(' / '))}。知識庫並陳，不自行判定。</div>` : ''}
    <h4>出處（${n.sources.length}）</h4>${n.sources.map(srcCard).join('')}`;
}

// 答案裡的 [e2] 轉成可點的引用編號；回傳 HTML 與引用到的事件
function renderAnswer(text) {
  const order = [];
  const html = esc(text).replace(/\[(e\d+)\]/g, (m, id) => {
    if (!G[id]) return '';
    if (!order.includes(id)) order.push(id);
    return `<a class="cite" data-id="${id}" title="${esc(G[id].label)}">${order.indexOf(id) + 1}</a>`;
  });
  return { html, order };
}
function renderTrust(order, answered) {
  const t = $('trust'), n = order.reduce((a, id) => a + (G[id].sources || []).length, 0);
  t.hidden = !answered; t.classList.toggle('warn', !order.length);
  t.innerHTML = order.length
    ? `依據 ${order.length} 件事件、${n} 筆已校對出處（點編號查看原文）<ol>${order.map(id => `<li data-id="${id}">${esc(G[id].label)} · 《${esc(G[id].sources[0]?.doc || '')}》第 ${G[id].sources[0]?.page || '?'} 頁${G[id].sources.length > 1 ? ` 等 ${G[id].sources.length} 筆` : ''}</li>`).join('')}</ol>`
    : '此回答沒有標註出處，請以下方相關實體的原始紀錄為準。';
}

function selectEntity(id) {
  const n = G[id];
  const rel = [...new Set(edges.get().flatMap(e => e.from === id ? [e.to] : e.to === id ? [e.from] : []))];
  $('detail').innerHTML = `<span id="back">← 返回</span><h3>${esc(n.label)}</h3><span class="chip" style="--c:${COLORS[n.kind]};cursor:default">${n.kind}</span>
    ${n.sources ? eventTrust(n) : `<pre>${esc(n.detail)}</pre>`}${group(rel)}`;
  $('back').onclick = clearFocus;
  show('detail');
  active = new Set([id, ...rel]); paint(); // 只留選到的實體與其鄰居，其餘變灰
  net.selectNodes([id]); focusLayout([...active], id);
}
function clearFocus() { show(hasAnswer ? 'answer' : 'home'); if (queryActive) { active = queryActive; paint(); focusLayout([...queryActive]); } else restoreLayout(); }
document.addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) selectEntity(c.dataset.id); });

fetch('/api/graph').then(r => r.json()).then(g => {
  g.nodes.forEach(n => G[n.id] = n);
  nodes = new vis.DataSet(g.nodes.map(n => ({ id: n.id, label: n.label, title: n.label, kind: n.kind, shape: 'dot' })));
  edges = new vis.DataSet(g.edges.map((e, i) => ({ ...e, id: i, arrows: { to: { scaleFactor: .5 } }, width: 2 })));
  window.net = new vis.Network($('mynetwork'), { nodes, edges }, {
    physics: { solver: 'forceAtlas2Based', stabilization: { iterations: 250 } },
    interaction: { hover: true, tooltipDelay: 200 }, edges: { smooth: false, font: { size: 10, color: '#666', strokeWidth: 0 } } });
  paint();
  net.once('stabilizationIterationsDone', () => $('loading').remove());
  net.on('click', p => { if (p.nodes.length) selectEntity(p.nodes[0]); else if (!$('detail').hidden) clearFocus(); });
  $('legend').innerHTML = Object.entries(COLORS).map(([k, c]) => `<label data-kind="${k}"><span style="background:${c}"></span>${k}</label>`).join('');
  $('legend').onclick = e => {
    const l = e.target.closest('label'); if (!l) return;
    only.has(l.dataset.kind) ? only.delete(l.dataset.kind) : only.add(l.dataset.kind); // 沒選 = 全部顯示
    document.querySelectorAll('#legend label').forEach(x => x.classList.toggle('off', only.size > 0 && !only.has(x.dataset.kind)));
    paint();
  };
});

async function ask() {
  const query = $('query-input').value.trim();
  if (!query) return;
  $('query-button').disabled = true;
  hasAnswer = true; $('answer').textContent = '檢索與生成中…'; $('trust').hidden = true; $('trust').innerHTML = ''; $('entities').innerHTML = ''; show('answer');
  try {
    const r = await (await fetch('/api/query', { method: 'POST', body: JSON.stringify({ query }), signal: AbortSignal.timeout(90000) })).json();
    const a = renderAnswer(r.answer); $('answer').innerHTML = a.html; renderTrust(a.order, r.entities.length > 0);
    $('entities').innerHTML = r.entities.length ? '<h4>相關實體（點擊查看）</h4>' + group(r.entities.filter(i => G[i].kind !== '年代')) : '';
    active = queryActive = r.entities.length ? new Set(r.entities) : null; paint();
    if (active) focusLayout(r.entities);
  } catch (e) { $('answer').textContent = '錯誤：' + e; }
  finally { $('query-button').disabled = false; $('query-input').focus(); }
}
$('query-button').onclick = ask;
// vis-network 在 window 綁了 Backspace/Delete 並 preventDefault，會讓輸入框刪不了字；擋住冒泡
$('query-input').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing) ask(); };
</script>
