<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文化資產知識庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F2EE; --panel: #FBFAF8; --line: #E3DFD8; --ink: #2f3a4a; --muted: #8B8579; --accent: #46627F; --accent-dark: #364C63; --tint: #EDEAE4; --sage: #5F8575; --sand: #C4A66B; }
  body { margin: 0; height: 100vh; display: flex; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--ink); overflow: hidden; }
  #sidebar { flex: 0 0 34%; min-width: 380px; max-width: 580px; display: flex; flex-direction: column; background: var(--panel); box-shadow: 1px 0 0 var(--line); z-index: 10; }
  #query-container { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
  #query-input { flex: 1; min-width: 0; box-sizing: border-box; height: 36px; padding: 0 10px; font-size: 16px; border: 1px solid #D5D0C6; border-radius: 4px; background: #fff; color: var(--ink); }
  #query-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #query-button { height: 36px; padding: 0 14px; font-size: 16px; color: #fff; background: var(--accent); border: 0; border-radius: 4px; cursor: pointer; }
  #query-button:hover { background: var(--accent-dark); }
  #query-button:disabled { background: #9FB0C0; cursor: wait; }
  #tabs[hidden], #ebar[hidden], #mode[hidden], #relbar[hidden], #detail[hidden] { display: none; }
  #ebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: #fff; border-bottom: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--c, var(--accent)); }
  #ebar #back { flex: 0 0 100%; } #ebar b { font: 600 20px/1.35 "Noto Serif TC", serif; }
  #mode { display: flex; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #mode button { flex: 1; height: 32px; font: 500 13px "Noto Sans TC", sans-serif; color: var(--muted); background: var(--tint); border: 0; border-radius: 16px; cursor: pointer; }
  #mode button.on { color: #fff; background: var(--accent); }
  #detail { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 20px; background: #fff; }
  #relbar { padding: 10px 14px 0; font-size: 12px; color: var(--muted); background: var(--panel); } #relbar b { color: var(--ink); font-weight: 500; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; padding: 9px 0; font: 12px "Noto Sans TC", sans-serif; color: var(--muted); background: none; border: 0; cursor: pointer; }
  #tabs button:hover { color: var(--ink); } #tabs button.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }
  .card { margin: 0 0 8px; padding: 9px 11px; background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .card { transition: transform .15s, box-shadow .15s, background .15s; }
  .card:hover { background: #F6F4EF; transform: translateY(-2px); box-shadow: 0 3px 8px rgba(47,58,74,.1); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } } .card b { display: block; font-size: 16px; } .card small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  #pane h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: normal; }
  #pane select { width: 100%; height: 32px; margin-bottom: 14px; padding: 0 8px; font-size: 12px; border: 1px solid #D5D0C6; border-radius: 4px; background: #fff; color: var(--ink); }
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .tl-item { position: relative; padding: 0 0 16px; cursor: pointer; }
  .tl-item::before { content: ''; position: absolute; left: -23px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px var(--panel); }
  .tl-y { font: 600 20px "Noto Serif TC", serif; } .tl-item:hover .tl-y { color: var(--accent); }
  .tl-t { margin-left: 6px; font-size: 12px; color: var(--muted); } .tl-s { margin-top: 2px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  #model svg { display: block; width: 100%; height: auto; }
  #model [data-part] { cursor: pointer; } #model [data-part]:hover { opacity: .8; }
  #results-container { flex: 1; overflow-y: auto; padding: 12px; }
  #results-content { white-space: pre-wrap; line-height: 1.6; margin-top: 6px; }
  #hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
  #brand { padding: 14px 12px 12px; border-bottom: 1px solid var(--line); font: 600 22px "Noto Serif TC", serif; color: var(--ink); }
  #brand small { display: block; margin-top: 2px; font: 400 12px "Noto Sans TC", sans-serif; color: var(--muted); }
  .cite { display: inline-block; min-width: 16px; padding: 0 4px; margin: 0 1px; font-size: 12px; line-height: 16px; text-align: center; color: #fff; background: var(--accent); border-radius: 8px; cursor: pointer; vertical-align: super; }
  .cite:hover { background: var(--accent-dark); }
  #trust { margin-top: 12px; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #3f5f52; background: #E9EEEA; border-radius: 6px; }
  #trust.warn { color: #6b5a2e; background: #F3EBDD; }
  #trust ol { margin: 6px 0 0; padding-left: 20px; } #trust li { cursor: pointer; } #trust li:hover { text-decoration: underline; }
  .conflict { margin: 10px 0; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #6b5a2e; background: #F3EBDD; border-radius: 6px; }
  .src { margin: 8px 0; padding: 8px 10px; font-size: 12px; line-height: 1.6; background: var(--tint); border-radius: 6px; }
  .src q { display: block; margin-top: 4px; color: #444; quotes: none; }
  .tag { display: inline-block; margin-right: 4px; padding: 0 6px; font-size: 12px; color: #3f5f52; background: #DCE6DF; border-radius: 8px; }
  .wait i { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
  #answer { white-space: pre-wrap; line-height: 1.7; font-size: 16px; }
  #entities h4, #detail h4 { margin: 16px 0 6px; font-size: 12px; color: var(--muted); font-weight: normal; }
  .chip { display: inline-block; margin: 0 6px 6px 0; padding: 3px 9px; font-size: 12px; background: var(--tint); border-radius: 12px; cursor: pointer; }
  .chip::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); }
  .chip:hover { background: #E0DCD3; }
  #back { color: var(--accent); cursor: pointer; font-size: 12px; }
  #legend label { cursor: pointer; user-select: none; margin-right: 6px; }
  #legend label.off { opacity: .4; }
  pre { white-space: pre-wrap; font-size: 12px; color: #4a4a45; background: var(--tint); padding: 8px; border-radius: 4px; }
  #graph { position: relative; flex: 1; min-width: 0; }
  #mynetwork { width: 100%; height: 100%; }
  #legend { position: absolute; left: 12px; bottom: 12px; z-index: 5; font-size: 12px; background: rgba(251,250,248,.92); padding: 8px 10px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
  #legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 8px; vertical-align: middle; }
  #tools { position: absolute; top: 12px; right: 12px; align-items: center; z-index: 5; display: flex; gap: 6px; }
  #tools select, #tools button { box-sizing: border-box; height: 36px; padding: 0 10px; font-size: 12px; color: var(--ink); border: 1px solid #D5D0C6; border-radius: 4px; background: var(--panel); cursor: pointer; }
  #tools button:hover { background: var(--tint); }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); }
  #reader { position: fixed; top: 4vh; left: 50%; transform: translateX(-50%); z-index: 51; width: min(860px, 94vw); height: 92vh; overflow-y: auto; padding: 20px 40px 56px; background: var(--bg); border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 16px 48px rgba(47,58,74,.25); }
  #rd-bg { position: fixed; inset: 0; z-index: 50; background: rgba(47,58,74,.45); } #rd-bg[hidden] { display: none; }
  #rd-bar { position: sticky; top: -20px; z-index: 2; margin: -20px -40px 8px; padding: 12px 40px; background: var(--bg); border-bottom: 1px solid var(--line); }
  #reader[hidden] { display: none; }
  #rd-bar { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; } #rd-bar a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #reader .kind { display: inline-block; padding: 0 8px; font-size: 12px; color: #fff; background: var(--accent); border-radius: 10px; }
  #reader h1 { margin: 10px 0 6px; font: 600 28px/1.35 "Noto Serif TC", serif; }
  #reader .lead { margin: 0 0 16px; color: var(--muted); line-height: 1.7; }
  #reader p.b { line-height: 1.9; font-size: 16px; margin: 0 0 14px; }
  #reader sup.c { margin: 0 1px; padding: 0 4px; font-size: 11px; color: #fff; background: var(--accent); border-radius: 8px; cursor: pointer; }
  #reader figure { margin: 0 0 18px; } #reader figure img { display: block; max-width: 100%; max-height: 380px; border-radius: 6px; background: var(--tint); }
  #reader figcaption { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.6; } #reader figcaption a { color: var(--accent); }
  #reader h3 { margin: 26px 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .05em; }
  #reader .ref { display: flex; gap: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12px; line-height: 1.6; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  #reader .ref.hl { border-color: var(--accent); background: #EAF0F5; } #reader .ref b { flex: 0 0 auto; color: var(--accent); } #reader .ref a { color: var(--accent); } #reader .ref small { color: var(--muted); }
  #reader .case { margin: 8px 0; padding: 10px 12px; font-size: 12px; line-height: 1.7; background: var(--tint); border-radius: 6px; }
  #reader .link { display: inline-block; margin: 0 6px 6px 0; padding: 3px 10px; font-size: 12px; background: var(--tint); border-radius: 12px; color: var(--ink); text-decoration: none; cursor: pointer; } #reader .link:hover { background: #E0DCD3; }
  #reader .gap { margin: 10px 0; padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #6b5a2e; background: #F3EBDD; border-radius: 6px; }
  #reader table { width: 100%; border-collapse: collapse; font-size: 12px; } #reader th, #reader td { padding: 8px 6px; vertical-align: top; border-bottom: 1px solid var(--line); text-align: left; }
  #reader th { font-weight: 500; color: var(--muted); } #reader th small { display: block; font-weight: 400; } #reader td.m { width: 96px; font-weight: 500; }
  #reader .ev { display: block; margin-bottom: 4px; padding: 3px 6px; font-size: 12px; line-height: 1.4; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #reader .ev::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); } #reader .ev:hover, #reader .ev.on { background: #EAF0F5; }
  #reader .stop { display: flex; gap: 14px; margin-bottom: 22px; } #reader .stop > i { flex: 0 0 28px; height: 28px; font: 500 14px/28px "Noto Sans TC"; text-align: center; color: #fff; background: var(--sage); border-radius: 50%; font-style: normal; }
  #reader .stop h2 { margin: 2px 0 6px; font-size: 20px; } #reader .stop p { margin: 0 0 8px; line-height: 1.8; font-size: 15px; }
  #detail figure.gal { margin: 10px 0 4px; } #detail figure.gal img { display: block; width: 100%; max-height: 220px; object-fit: contain; border-radius: 4px; background: var(--tint); }
  #detail figure.gal figcaption { margin-top: 4px; font-size: 12px; color: var(--ink); } #detail figure.gal small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); } #detail figure.gal small a { color: var(--accent); }
  .gal-t { margin-top: 6px; } .gal-t button { width: 24px; height: 24px; margin-right: 4px; font: 12px "Noto Sans TC"; color: var(--muted); background: var(--tint); border: 0; border-radius: 12px; cursor: pointer; } .gal-t button.on { color: #fff; background: var(--accent); }
</style>
</head>
<body>
<aside id="sidebar">
  <div id="brand">文化資產知識庫<small>答案皆來自可公開的知識圖譜，並附出處</small></div>
  <div id="query-container">
    <input id="query-input" placeholder="問知識圖譜一個問題，例如：鐵刃銅柄劍為什麼不清潔？" autofocus>
    <button id="query-button">Search</button>
  </div>
  <div id="ebar" hidden></div>
  <div id="mode" hidden></div>
  <section id="detail" hidden></section>
  <div id="relbar" hidden></div>
  <div id="tabs"></div>
  <div id="results-container">
    <div id="pane" hidden></div>
    <div id="hint">輸入問題後，答案會顯示在這裡，相關實體可點擊查看；右側圖譜中無關節點會變灰。也可直接點圖上的節點。</div>
    <div id="answer" hidden></div>
    <div id="trust" hidden></div>
    <div id="entities" hidden></div>
  </div>
</aside>
<main id="graph">
  <div id="loading">Loading graph...</div>
  <div id="rd-bg" data-rd-close hidden></div>
  <article id="reader" hidden></article>
  <div id="mynetwork"></div>
  <div id="tools">
  <select id="layout" title="佈局">
    <option value="fa2">ForceAtlas2（力導向）</option><option value="circular">環形</option>
    <option value="cluster">依類別分群</option><option value="noverlap">防重疊（Noverlap）</option><option value="random">隨機</option>
  </select>
  <select id="focus-mode" title="聚焦排法">
    <option value="concentric">聚焦：同心圓</option><option value="force">聚焦：力導向</option>
    <option value="columns">聚焦：依類別分欄</option><option value="timeline">聚焦：時間軸</option>
  </select>
  <button id="restore" title="還原到搜尋前的佈局並取消變灰">還原佈局</button>
  </div>
  <div id="legend"></div>
</main>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.0.2/lib/anime.umd.min.js"></script>
<script>
const rise = sel => { // 側欄內容依序淡入上浮（anime.js 載入失敗或使用者偏好減少動態時略過）
  if (!window.anime || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  anime.animate(sel, { opacity: [0, 1], y: [14, 0], delay: anime.stagger(60), duration: 450, ease: 'outCubic' });
};
let pulseAnim;
const pulse = id => { // 選中的節點放大再縮回；動畫值直接餵給 vis 的 size
  if (pulseAnim) pulseAnim.cancel();
  if (!window.anime || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const o = { s: 1 };
  pulseAnim = anime.animate(o, { s: [1, 1.5, 1], duration: 700, ease: 'outQuad', onUpdate: () => nodes.update({ id, size: SIZE[id] * o.s }) });
};
const waitDots =() => { // 問答等待：三點依序跳動；回傳停止函式
  const a = window.anime && !matchMedia('(prefers-reduced-motion: reduce)').matches && anime.animate('.wait i', { y: [0, -6, 0], opacity: [.35, 1, .35], delay: anime.stagger(140), duration: 700, loop: true, ease: 'inOutSine' });
  return () => a && a.cancel();
};
const COLORS = { 文物: '#2c3172', 部位: '#234f81', 人物: '#1d6c8a', 單位: '#33858d', 事件: '#509e90', 文件: '#76b791', 材質: '#8dc08b', 知識: '#C4A66B' }; // seaborn crest 色系
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let nodes, edges, G = {}, active = null, queryActive = null, only = new Set(), solo = null, hasAnswer = false;

// 套用目前狀態：有查詢時，無關節點與邊變灰；類別被關掉的節點隱藏
let SIZE = {};
function paint() {
  nodes.update(nodes.get().map(n => {
    const dim = active && !active.has(n.id), hit = active && active.has(n.id);
    // 純色節點、大小依連線數（Gephi 風格）；無關節點變灰
    const c = dim ? '#E6E3DD' : COLORS[n.kind];
    // 標籤：小節點平時不顯示、長標題截斷；被選中／命中的節點放寬
    const cut = (s, k) => s.length > k ? s.slice(0, k - 1) + '…' : s, show = hit || SIZE[n.id] >= 18;
    return { id: n.id, label: show ? cut(G[n.id].label, n.id === SEL ? 14 : hit ? 10 : 8) : '', hidden: (only.size > 0 && !only.has(n.kind)) || (solo && !solo.has(n.id)), size: SIZE[n.id], borderWidth: 0,
      color: { background: c, border: '#2f3a4a', highlight: { background: c, border: '#2f3a4a' }, hover: { background: c, border: '#2f3a4a' } },
      font: { size: show ? 12 + SIZE[n.id] / 8 : 0, color: dim ? '#C9C5BD' : '#2f3a4a', strokeWidth: 3, strokeColor: '#F4F2EE' } };
  }));
  edges.update(edges.get().map(e => {
    const on = !active || (active.has(e.from) && active.has(e.to));
    return { id: e.id, color: { color: on ? '#C9C4BA' : '#EBE8E2', highlight: '#8B8579', hover: '#8B8579' }, font: { size: active && on && (!SEL || e.from === SEL || e.to === SEL) ? 10 : 0, color: '#666', strokeWidth: 0 } };
  }));
}

// 佈局：fa2 交給 vis 物理引擎，其餘直接算座標後關掉物理
function setLayout(name) {
  net.setOptions({ physics: { enabled: name === 'fa2' } });
  if (name === 'fa2') return net.stabilize(250);
  const ids = nodes.getIds(), R = 60 * Math.sqrt(ids.length), P = {};
  const kinds = Object.keys(COLORS), byKind = k => ids.filter(i => G[i].kind === k);
  if (name === 'circular') [...ids].sort((a, b) => kinds.indexOf(G[a].kind) - kinds.indexOf(G[b].kind))
    .forEach((id, i) => P[id] = [R * Math.cos(2 * Math.PI * i / ids.length), R * Math.sin(2 * Math.PI * i / ids.length)]);
  if (name === 'random') ids.forEach(id => P[id] = [(Math.random() - .5) * 2 * R, (Math.random() - .5) * 2 * R]);
  if (name === 'cluster') kinds.forEach((k, ki) => { const m = byKind(k), a = 2 * Math.PI * ki / kinds.length, cx = R * Math.cos(a), cy = R * Math.sin(a);
    m.forEach((id, i) => P[id] = m.length === 1 ? [cx, cy] : [cx + 25 * Math.sqrt(m.length) * Math.cos(2 * Math.PI * i / m.length), cy + 25 * Math.sqrt(m.length) * Math.sin(2 * Math.PI * i / m.length)]); });
  if (name === 'noverlap') { // 從目前位置出發，把太近的節點推開
    const cur = net.getPositions(); ids.forEach(id => P[id] = [cur[id].x, cur[id].y]);
    for (let it = 0; it < 200; it++) for (const a of ids) for (const b of ids) if (a < b) {
      const dx = P[b][0] - P[a][0], dy = P[b][1] - P[a][1], d = Math.hypot(dx, dy) || .01, min = 90;
      if (d < min) { const f = (min - d) / 2 / d; P[a][0] -= dx * f; P[a][1] -= dy * f; P[b][0] += dx * f; P[b][1] += dy * f; } } }
  ids.forEach(id => net.moveNode(id, P[id][0], P[id][1]));
  net.fit({ animation: true });
}
// 聚焦：命中／選取的節點依「聚焦排法」重排，其餘節點往外推開，補間動畫後鏡頭拉近
let anim = 0, home = null, focusMode = 'concentric';
const KIND_ORDER = Object.keys(COLORS);

const arrangers = { // 各回傳 { id: [x, y] }，座標以 (cx, cy) 為中心
  concentric(ids, es, center, cx, cy) { // 以中心節點為圓心、依連線距離排同心圓
    const nb = id => es.flatMap(e => e.from === id ? [e.to] : e.to === id ? [e.from] : []);
    const depth = { [center]: 0 };
    for (let q = [center]; q.length;) { const f = q.shift(); nb(f).forEach(n => depth[n] === undefined && (depth[n] = depth[f] + 1, q.push(n))); }
    const maxD = Math.max(...Object.values(depth)) + 1, rings = {}, T = { [center]: [cx, cy] };
    ids.forEach(i => (rings[depth[i] ?? maxD] ||= []).push(i));
    for (const m of Object.values(rings)) m.sort((a, b) => KIND_ORDER.indexOf(G[a].kind) - KIND_ORDER.indexOf(G[b].kind)); // 同類相鄰，減少交叉
    for (const [d, m] of Object.entries(rings)) if (+d > 0) {
      const r = Math.max(210 * d, m.length * 120 / (2 * Math.PI));
      m.forEach((id, k) => T[id] = [cx + r * Math.cos(2 * Math.PI * k / m.length + +d), cy + r * Math.sin(2 * Math.PI * k / m.length + +d)]);
    }
    return T;
  },
  force(ids, es, center, cx, cy) { // 從同心圓出發，只對命中子圖跑 Fruchterman-Reingold，看出自然群聚
    const T = arrangers.concentric(ids, es, center, cx, cy), P = Object.fromEntries(ids.map(i => [i, [...T[i]]]));

      const min = SIZE[a] + SIZE[b] + 100; // 節點半徑＋標籤空間

  columns(ids, es, center, cx, cy) { // 依類別分欄：文物 | 事件 | 人物 ...，欄內依名稱排序

  timeline(ids, es, center, cx, cy) { // 時間軸：事件依年代由左到右，其他實體靠到相關事件下方（各類別一列）

function tween(T, done) { // 補間動畫：所有節點從目前位置移到 T
  const cur = net.getPositions(nodes.getIds()), token = ++anim, t0 = performance.now();

  net.setOptions({ physics: { enabled: false } });
  const step = now => {
    if (token !== anim) return;
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < .5 ? 4 * k ** 3 : 1 - (-2 * k + 2) ** 3 / 2;
    for (const id in T) net.moveNode(id, cur[id].x + (T[id][0] - cur[id].x) * e, cur[id].y + (T[id][1] - cur[id].y) * e);
    k < 1 ? requestAnimationFrame(step) : done && done();
  };

}

function focusLayout(ids, center) {
  const act = new Set(ids), cur = net.getPositions(nodes.getIds()); // 指定 id，隱藏的節點才拿得到座標
  home ||= Object.fromEntries(Object.entries(cur).map(([id, p]) => [id, [p.x, p.y]])); // 第一次聚焦前先記住佈局，供「還原」用
  const es = edges.get().filter(e => act.has(e.from) && act.has(e.to));
  const deg = id => es.filter(e => e.from === id || e.to === id).length;
  center = center || [...act].sort((a, b) => deg(b) - deg(a))[0];
  const cx = ids.reduce((a, i) => a + cur[i].x, 0) / ids.length, cy = ids.reduce((a, i) => a + cur[i].y, 0) / ids.length;
  const T = arrangers[focusMode](ids, es, center, cx, cy);
  const outer = Math.max(...ids.map(i => Math.hypot(T[i][0] - cx, T[i][1] - cy)));
  for (const id of nodes.getIds()) if (!act.has(id)) { // 無關節點沿原方向被推到外圍
    const dx = cur[id].x - cx, dy = cur[id].y - cy, d = Math.hypot(dx, dy) || 1, to = outer + 260 + d * .4;
    T[id] = [cx + dx / d * to, cy + dy / d * to];
  }
  tween(T, () => net.fit({ nodes: ids, animation: { duration: 700, easingFunction: 'easeInOutQuad' } }));
}

  $('ebar').innerHTML = `<span id="back">← 回到全部</span><span class="chip" style="--c:${COLORS[n.kind]};cursor:default;margin:0">${n.kind}</span><b>${esc(n.label)}</b>`;
  $('detail').innerHTML = `${gallery(n)}
    ${n.kind === '部位' && partOf(n) ? `<h4>在掛軸中的位置（示意）</h4><div id="model">${modelSvg(partOf(n), true)}</div>` : ''}${n.sources ? eventTrust(n) : n.kind === '文件' ? docIntro(n) : `<pre>${esc(n.detail)}</pre>`}${n.entry ? `<p><a href="#" data-read="${id}" style="color:var(--accent)">閱讀條目全文（圖片、引用、案例）→</a></p>` : ''}`;
  $('back').onclick = clearFocus;
  rise('#detail > *');
  SEL = id; SCOPE = hops2(id);
  setTab(TAB); // 先看這個實體的介紹；切到「相關實體」才列出兩度內的其他實體（從問答進來會自動選有內容的一類）
  active = SCOPE; solo = only1 ? active : null; paint(); // 只留選到的實體與其鄰居，其餘變灰
  net.selectNodes([id]); pulse(id); focusLayout([...active], id); // 圖與各分頁看同一份兩度範圍
}
function clearFocus() { endSel(); if (queryActive) { active = queryActive; paint(); focusLayout([...queryActive]); } else restoreLayout(); }
document.addEventListener('click', e => { const c = e.target.closest('[data-id]'); if (c) { if (e.target.closest('#reader')) closeReader(); selectEntity(c.dataset.id, false, !!e.target.closest('#pane')); } });

// ---- 知識閱讀器：條目全文、引用、案例溯源、導覽、介入光譜（原 kb.html 併入） ----
let KB = null, RD = null;
const LV_COLOR = { l1: '#5F8575', l2: '#7E9E8E', l3: '#C4A66B', l4: '#C28E55', l5: '#46627F', l6: '#9C4A3C' };
const rdLink = id => `<a class="link" data-read="${id}">${esc(KB.entries.find(e => e.id === id).title)}</a>`;
const rdLinks = ids => (ids || []).filter(i => KB.entries.some(e => e.id === i)).map(rdLink).join('');
function caseHtml(id) {
  const n = G[id]; if (!n) return '';
  const desc = (n.detail.split('\n')[0] || '').replace(/^\[e\d+\]\s*/, '');
  return `<div class="case"><b>${esc(n.label)}</b><br>${esc(desc)}${(n.sources || []).map(s => `<div class="src">《${esc(s.doc)}》第 ${s.page} 項<q>${esc(s.quote)}</q></div>`).join('')}<br><a class="link" data-id="${id}" style="margin-top:6px">在圖譜中查看此事件 →</a></div>`;
}
function rdBody(e) {
  const order = [];
  const html = e.body.map(p => `<p class="b">${esc(p).replace(/\[(s\d+)\]/g, (m, id) => {
    if (!KB.sources[id]) return '';
    if (!order.includes(id)) order.push(id);
    return `<sup class="c" data-ref="${id}" title="${esc(KB.sources[id].title)}">${order.indexOf(id) + 1}</sup>`;
  })}</p>`).join('');
  return { html, order };
}
const refHtml = (id, n) => { const s = KB.sources[id]; return `<div class="ref" id="ref-${id}"><b>[${n}]</b><div>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)} <span class="tag">${esc(s.kind)}</span><br><small>${esc(s.note)}</small></div></div>`; };
const imgHtml = i => `<figure><img loading="lazy" src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(i.file)}?width=900" alt="${esc(i.caption)}"><figcaption>${esc(i.caption)}。攝影：${esc(i.author)}，${esc(i.license)}，<a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(i.file)}" target="_blank" rel="noopener">Wikimedia Commons</a></figcaption></figure>`;
function rdSpectrum() {
  const L = KB.spectrum.levels;
  const head = `<tr><th>材質</th>${L.map((l, i) => `<th title="${esc(l.desc)}"><span style="color:${LV_COLOR[l.id]}">●</span> ${i + 1}<small>${esc(l.name)}</small></th>`).join('')}</tr>`;
  const rows = KB.spectrum.rows.map(r => `<tr><td class="m">${esc(r.material)}</td>${L.map(l => `<td>${r.events.filter(x => x.level === l.id && G[x.e]).map(x =>
    `<span class="ev" style="--c:${LV_COLOR[l.id]}" data-case="${x.e}">${esc(x.why)}</span>`).join('')}</td>`).join('')}</tr>`).join('');
  return `<table>${head}${rows}</table><div id="spcase"></div><h3>光譜說明</h3>${L.map((l, i) => `<p class="b" style="margin:0 0 6px;font-size:14px"><span style="color:${LV_COLOR[l.id]}">●</span> <b>${i + 1} ${esc(l.name)}</b>：${esc(l.desc)}</p>`).join('')}`;
}
function openReader(id) {
  const e = KB.entries.find(x => x.id === id), t = KB.tour, cases = e && (e.cases || []).filter(c => G[c]);
  let h;
  if (e) {
    const b = rdBody(e);
    h = `<span class="kind">${esc(e.type)}</span><h1>${esc(e.title)}</h1><p class="lead">${esc(e.summary)}</p><span class="tag">引用 ${b.order.length} 筆來源</span>
      ${e.img ? '<br><br>' + imgHtml(e.img) : ''}${b.html}${e.spectrum ? '<h3>光譜：本庫各案例的位置</h3>' + rdSpectrum() : ''}
      ${cases.length ? `<h3>本庫案例（${cases.length}）— 附展覽網頁出處</h3>` + cases.map(caseHtml).join('') : ''}
      <p><a class="link" data-focus="${id}">在圖譜中查看此條目與相關實體 →</a></p>
      <h3>參考來源</h3>${b.order.map((s, i) => refHtml(s, i + 1)).join('')}${e.links ? '<h3>延伸閱讀</h3>' + rdLinks(e.links) : ''}`;
  } else {
    id = 'tour';
    h = `<span class="kind">導覽</span><h1>${esc(t.title)}</h1><p class="lead">依國立故宮博物院「文物新生」特展的動線，把保存修護的知識條目、文物案例與出處串起來。</p>
      ${t.stops.map((s, i) => `<div class="stop"><i>${i + 1}</i><div><h2>${esc(s.name)}</h2><p>${esc(s.text)}</p>${rdLinks(s.entries)}
        ${(s.objects || []).filter(o => G[o]).map(o => `<a class="link" data-id="${o}">文物：${esc(G[o].label)}</a>`).join('')}
        ${s.gap ? `<div class="gap">資料缺口：${esc(s.gap)}</div>` : ''}${s.spectrum ? '<br><br>' + rdSpectrum() : ''}</div></div>`).join('')}`;
  }
  RD = id; $('reader').hidden = $('rd-bg').hidden = false;
  $('reader').innerHTML = `<div id="rd-bar"><a data-read="tour">▶ 導覽</a><a data-rd-close>關閉 ✕</a></div>` + h;
  $('reader').scrollTop = 0;
}
const closeReader = () => { $('reader').hidden = $('rd-bg').hidden = true; RD = null; };
document.addEventListener('click', ev => {
  const r = ev.target.closest('[data-read]'); if (r) { ev.preventDefault(); return openReader(r.dataset.read); }
  if (ev.target.closest('[data-rd-close]')) return closeReader();
  const f = ev.target.closest('[data-focus]'); if (f) { closeReader(); return selectEntity(f.dataset.focus); }
  const c = ev.target.closest('#reader sup.c');
  if (c) { document.querySelectorAll('#reader .ref').forEach(x => x.classList.remove('hl')); const x = $('ref-' + c.dataset.ref); x.classList.add('hl'); x.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  const v = ev.target.closest('#reader .ev');
  if (v) { document.querySelectorAll('#reader .ev').forEach(x => x.classList.toggle('on', x === v)); const box = $('spcase'); box.innerHTML = caseHtml(v.dataset.case); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && RD) closeReader(); });
fetch('knowledge.json').then(r => r.json()).then(k => KB = k);

fetch('/api/graph').then(r => r.json()).then(g => {
  g.nodes.forEach(n => G[n.id] = n);
  const deg = {}; g.edges.forEach(e => { deg[e.from] = (deg[e.from] || 0) + 1; deg[e.to] = (deg[e.to] || 0) + 1; });
  const dv = Object.values(deg), lo = Math.min(...dv), hi = Math.max(...dv); // 大小 = 連線數，開根號壓縮差距
  g.nodes.forEach(n => SIZE[n.id] = 8 + 40 * Math.sqrt(((deg[n.id] || lo) - lo) / (hi - lo || 1)));
  nodes = new vis.DataSet(g.nodes.map(n => ({ id: n.id, label: n.label, title: n.label, kind: n.kind, shape: 'dot' })));
  edges = new vis.DataSet(g.edges.map((e, i) => ({ ...e, id: i, width: 1.5 })));
  window.net = new vis.Network($('mynetwork'), { nodes, edges }, {
    physics: { solver: 'forceAtlas2Based', stabilization: { iterations: 250 } },
    interaction: { hover: true, tooltipDelay: 200 }, edges: { smooth: false, font: { size: 10, color: '#666', strokeWidth: 0 } } });
  paint(); setTab('qa');
  net.once('stabilizationIterationsDone', () => { $('loading').remove(); const h = decodeURIComponent(location.hash.slice(1)); if (G[h]) selectEntity(h, true); }); 
  net.on('click', p => { if (p.nodes.length) selectEntity(p.nodes[0]); else if (SEL) clearFocus(); });
  $('legend').innerHTML = Object.entries(COLORS).map(([k, c]) => `<label data-kind="${k}"><span style="background:${c}"></span>${k}</label>`).join('');
  $('legend').onclick = e => {
    const l = e.target.closest('label'); if (!l) return;
    only.has(l.dataset.kind) ? only.delete(l.dataset.kind) : only.add(l.dataset.kind); // 沒選 = 全部顯示
    document.querySelectorAll('#legend label').forEach(x => x.classList.toggle('off', only.size > 0 && !only.has(x.dataset.kind)));
    paint();
  };
});

async function ask() {
  const query = $('query-input').value.trim();
  if (!query) return;
  $('query-button').disabled = true; SEL = null; setTab('qa');
  hasAnswer = true; $('answer').innerHTML = '<span class="wait">檢索與生成中<i></i><i></i><i></i></span>'; $('trust').hidden = true; $('trust').innerHTML = ''; $('entities').innerHTML = ''; show('answer');
  const stopWait = waitDots();
  try {
    const r = await (await fetch('/api/query', { method: 'POST', body: JSON.stringify({ query }), signal: AbortSignal.timeout(90000) })).json();
    stopWait();
    const a = renderAnswer(r.answer); $('answer').innerHTML = a.html; renderTrust(a.order, r.entities.length > 0);
    $('entities').innerHTML = r.entities.length ? '<h4>相關實體（點擊查看）</h4>' + group(r.entities.filter(i => G[i].kind !== '年代')) : '';
    rise('#answer, #entities .chip');
    active = queryActive = r.entities.length ? new Set(r.entities) : null; SCOPE = queryActive; paint();
    if (active) focusLayout(r.entities);
  } catch (e) { $('answer').textContent = '錯誤：' + e; }
  finally { stopWait(); $('query-button').disabled = false; $('query-input').focus(); }
}
$('query-button').onclick = ask;
// vis-network 在 window 綁了 Backspace/Delete 並 preventDefault，會讓輸入框刪不了字；擋住冒泡
$('query-input').onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing) ask(); };
</script>
</body>
